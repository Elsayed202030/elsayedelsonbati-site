<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 110" width="420" height="110" role="img" aria-labelledby="logoTitle logoDesc">
  <title id="logoTitle">ELSAYEDELSONBATI Logo</title>
  <desc id="logoDesc">Geometric financial emblem combining ledger columns, growth trend line, and German accounting badge for ELSAYEDELSONBATI</desc>
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde68a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="panelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#132038" />
      <stop offset="100%" stop-color="#090f1d" />
    </linearGradient>
  </defs>

  <!-- Emblem Badge -->
  <g transform="translate(12, 10)">
    <rect x="2" y="2" width="86" height="86" rx="20" fill="url(#panelGrad)" stroke="url(#goldGrad)" stroke-width="2.5" />
    <rect x="8" y="8" width="74" height="74" rx="15" fill="none" stroke="url(#cyanGrad)" stroke-width="1" stroke-opacity="0.45" />

    <!-- Ledger & Balance Bars -->
    <rect x="21" y="48" width="9" height="20" rx="2.5" fill="url(#goldGrad)" />
    <rect x="35" y="38" width="9" height="30" rx="2.5" fill="url(#cyanGrad)" />
    <rect x="49" y="29" width="9" height="39" rx="2.5" fill="url(#goldGrad)" />

    <!-- Trend Line -->
    <path d="M22 41 L37 29 L49 34 L67 19" fill="none" stroke="#fef08a" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="67" cy="19" r="3.8" fill="#22d3ee" stroke="#090f1d" stroke-width="1.5" />

    <!-- Monogram Accent -->
    <text x="45" y="80" text-anchor="middle" fill="#fde68a" font-family="Inter, Arial, sans-serif" font-size="9" font-weight="800" letter-spacing="1.5">DE • FiBu</text>
  </g>

  <!-- Wordmark -->
  <g transform="translate(114, 34)">
    <text x="0" y="18" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="900" letter-spacing="0.8">ELSAYEDELSONBATI</text>
    <rect x="0" y="26" width="278" height="2" rx="1" fill="url(#goldGrad)" opacity="0.7" />
    <text x="0" y="46" fill="#67e8f9" font-family="Inter, Arial, sans-serif" font-size="11.5" font-weight="700" letter-spacing="0.5">BUCHHALTUNG &amp; RECHNUNGSWESEN</text>
    <text x="0" y="64" fill="#cbd5e1" font-family="Cairo, Arial, sans-serif" font-size="12" font-weight="600">بوابة المحاسبة والمالية في ألمانيا</text>
  </g>
</svg>